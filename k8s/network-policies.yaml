apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: user-management
  labels:
    app: postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
      tier: database
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
          tier: api
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: user-management
  labels:
    app: backend
spec:
  podSelector:
    matchLabels:
      app: backend
      tier: api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
          tier: frontend
    ports:
    - protocol: TCP
      port: 5000
  - from: # Health check ve monitoring için kube-system namespace'den erişim
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 5000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
          tier: database
    ports:
    - protocol: TCP
      port: 5432
  - to: {} # DNS çözümlemesi için
    ports:
    - protocol: UDP
      port: 53
  - to: {} # HTTPS/HTTP dış erişim gerekirse (npm packages vs.)
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: user-management
  labels:
    app: frontend
spec:
  podSelector:
    matchLabels:
      app: frontend
      tier: frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - {} # Herkes frontend'e erişebilir (dış dünyadan gelen trafik için)
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: backend
          tier: api
    ports:
    - protocol: TCP
      port: 5000
  - to: {} # DNS çözümlemesi için
    ports:
    - protocol: UDP
      port: 53
  - to: {} # CDN'ler ve external resources için
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
