apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: usermgmt
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: usermgmt
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: usermgmt
    spec:
      containers:
        - name: backend
          image: 192.168.0.146:5000/user-management-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: postgres
            - name: DB_USER
              value: postgres
            - name: DB_NAME
              value: userdb
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: DB_PORT
              value: "5432"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: usermgmt
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: usermgmt
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 5000
      targetPort: http

